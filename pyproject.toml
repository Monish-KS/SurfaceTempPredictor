[project]
name = "world-temperature-viewer"
version = "0.1.0" # You might want to update this version number as the project evolves
description = "Surface Temperature Predictor utilizing the Global Land Temperature By City dataset and Meta AI Prophet Framework for temperature forecasting. Features dynamic visualizations, global and regional insights, forecasting capabilities, a Streamlit-powered interface, and Docker support."
readme = "README.md"
keywords = ["Surface Temperature Predictor", "Global Land Temperature", "Berkeley Earth", "Meta AI Prophet Framework", "Temperature Forecasting", "Data Visualization", "Streamlit", "Docker", "Climate Change", "Python"]
requires-python = ">=3.8"
dependencies = [
    "altair==4.2.0",
    "joblib==1.2.0",
    "matplotlib==3.5.3",
    "numpy==1.26.2",
    "pandas==1.4.4",
    "Pillow==9.2.0",
    "plotly==5.13.0",
    "prophet==1.1.4",
    "scikit-learn==1.2.1",
    "seaborn==0.12.0",
    "streamlit==1.20.0",
    "streamlit-option-menu==0.3.2",
    "toml==0.10.2",
    "tqdm==4.64.1",
    "vega-datasets==0.9.0",
    "cmdstanpy==1.1.0",
    "ollama",
    "flask==2.0.1",
    "werkzeug==2.0.3",
    "requests==2.26.0",
]

[project.urls]
"Homepage" = "https://github.com/your-repo/WorldTemperatureViewer" # Replace with your actual repository URL
"Bug Tracker" = "https://github.com/your-repo/WorldTemperatureViewer/issues" # Replace with your actual repository URL

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"